# Build from the repo root: docker compose -f apps/hub/docker-compose.yaml build
# (the build context is the monorepo root; see apps/hub/Dockerfile).
services:
  hub:
    build:
      context: ../..
      dockerfile: apps/hub/Dockerfile
    image: atriarch/tracery-hub:dev
    restart: unless-stopped
    ports:
      - "8971:8971"
    environment:
      TRACERY_STORE: sqlite
      TRACERY_SQLITE_PATH: /data/tracery.db
      TRACERY_RETENTION_HOURS: "72"
      TRACERY_MAX_EVENTS_PER_WORKSPACE: "500000"
      TRACERY_LOG_LEVEL: info
      # Either set TRACERY_API_KEYS inline, or mount a keys file and point
      # TRACERY_API_KEYS_FILE at it (see ./keys.example.json below). With
      # neither set, the hub prints a dev key to its logs on boot.
      TRACERY_API_KEYS_FILE: /run/secrets/tracery-keys.json
    volumes:
      - tracery-data:/data
      - ./keys.example.json:/run/secrets/tracery-keys.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8971/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tracery-data:
