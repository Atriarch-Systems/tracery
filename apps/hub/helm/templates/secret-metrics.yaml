{{- if and (not .Values.metrics.existingSecret) .Values.metrics.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracery-hub.metricsSecretName" . }}
  labels:
    {{- include "tracery-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.metrics.token | quote }}
{{- end }}
