{{- if and (not .Values.apiKeys.existingSecret) (gt (len .Values.apiKeys.keys) 0) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracery-hub.apiKeysSecretName" . }}
  labels:
    {{- include "tracery-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Shape: apps/hub/README.md "API key file format" -- a JSON array of
  # { id, key, workspace, roles: ["ingest"|"read"|"admin"] }.
  keys.json: |
    {{- .Values.apiKeys.keys | toJson | nindent 4 }}
{{- end }}
