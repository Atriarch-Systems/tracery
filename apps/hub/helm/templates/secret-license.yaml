{{- if and .Values.license.enabled (not .Values.license.existingSecret) .Values.license.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracery-hub.licenseSecretName" . }}
  labels:
    {{- include "tracery-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  license: {{ .Values.license.key | quote }}
{{- end }}
