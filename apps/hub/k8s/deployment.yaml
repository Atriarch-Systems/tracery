apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-hub
  namespace: activity
  labels:
    app.kubernetes.io/name: activity-hub
spec:
  replicas: 1 # SqliteStore/MemoryStore are single-writer; do not scale this beyond 1 until a shared store (Postgres, SPEC.md §6 follow-up) lands.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: activity-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activity-hub
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: hub
          image: atriarch/activity-hub:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8971
          env:
            - name: ACTIVITY_PORT
              value: "8971"
            - name: ACTIVITY_HOST
              value: "0.0.0.0"
            - name: ACTIVITY_STORE
              value: sqlite
            - name: ACTIVITY_SQLITE_PATH
              value: /data/activity.db
            - name: ACTIVITY_API_KEYS_FILE
              value: /etc/activity/keys.json
            - name: ACTIVITY_RETENTION_HOURS
              value: "72"
            - name: ACTIVITY_MAX_EVENTS_PER_WORKSPACE
              value: "500000"
            - name: ACTIVITY_LOG_LEVEL
              value: info
          volumeMounts:
            - name: data
              mountPath: /data
            - name: keys
              mountPath: /etc/activity
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: activity-hub-data
        - name: keys
          secret:
            secretName: activity-hub-keys
