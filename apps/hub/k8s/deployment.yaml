apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracery-hub
  namespace: tracery
  labels:
    app.kubernetes.io/name: tracery-hub
spec:
  replicas: 1 # SqliteStore/MemoryStore are single-writer; do not scale this beyond 1 until a shared store (Postgres, SPEC.md §6 follow-up) lands.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tracery-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracery-hub
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: hub
          image: atriarch/tracery-hub:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8971
          env:
            - name: TRACERY_PORT
              value: "8971"
            - name: TRACERY_HOST
              value: "0.0.0.0"
            - name: TRACERY_STORE
              value: sqlite
            - name: TRACERY_SQLITE_PATH
              value: /data/tracery.db
            - name: TRACERY_API_KEYS_FILE
              value: /etc/tracery/keys.json
            - name: TRACERY_RETENTION_HOURS
              value: "72"
            - name: TRACERY_MAX_EVENTS_PER_WORKSPACE
              value: "500000"
            - name: TRACERY_LOG_LEVEL
              value: info
          volumeMounts:
            - name: data
              mountPath: /data
            - name: keys
              mountPath: /etc/tracery
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tracery-hub-data
        - name: keys
          secret:
            secretName: tracery-hub-keys
