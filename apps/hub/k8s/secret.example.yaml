# Example only -- do not commit real keys. Replace the values below and
# `kubectl apply -f -` (or, preferably, provision this from OpenBao via an
# ExternalSecret and never write real keys into git at all).
apiVersion: v1
kind: Secret
metadata:
  name: tracery-hub-keys
  namespace: tracery
  labels:
    app.kubernetes.io/name: tracery-hub
type: Opaque
stringData:
  # Mounted at /etc/tracery/keys.json and referenced by TRACERY_API_KEYS_FILE
  # (see deployment.yaml). Shape: SPEC.md §6 "Auth" -- a JSON array of
  # { id, key, workspace, roles: ["ingest"|"read"|"admin"] }.
  keys.json: |
    [
      { "id": "saga", "key": "REPLACE_ME", "workspace": "saga", "roles": ["ingest", "read"] },
      { "id": "operator", "key": "REPLACE_ME", "workspace": "*", "roles": ["ingest", "read", "admin"] }
    ]
