[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atriarch-tracery-graph"
version = "0.1.0"
description = "Tracery Graph emitter SDK: stdlib-only Python client for the Tracery Graph wire contract."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Atriarch Systems" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Atriarch-Systems/tracery-graph/tree/main/clients/python#readme"
Repository = "https://github.com/Atriarch-Systems/tracery-graph"
Issues = "https://github.com/Atriarch-Systems/tracery-graph/issues"
Funding = "https://ko-fi.com/demonslyr"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"atriarch.tracery" = ["py.typed"]
