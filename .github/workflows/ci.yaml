name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node:
    # Fork code must be reviewed before it is copied to a trusted branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, arc-amd64]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node -e "const [m,n]=process.versions.node.split('.').map(Number); if(m<22||(m===22&&n<13)) process.exit(1)"
      - run: npm ci
      - run: npm run license:check
      - run: node --test scripts/release-license-gate.test.mjs scripts/release-docker-repository.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:plugin
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with: { version: v0.74.0, cache: false }
      - name: License inventory and source SBOM
        run: |
          mkdir -p artifacts
          trivy fs --scanners license --license-full --include-dev-deps --offline-scan --skip-version-check --skip-dirs .git --skip-dirs artifacts --format json --output artifacts/licenses.json .
          trivy fs --scanners license --include-dev-deps --offline-scan --skip-version-check --skip-dirs .git --skip-dirs artifacts --format cyclonedx --output artifacts/sbom.cdx.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-and-sbom
          path: artifacts/

  python:
    # Fork code must be reviewed before it is copied to a trusted branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, arc-amd64]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -c "import sys; assert sys.version_info[:2]==(3,11), sys.version"
      - run: python -m pip install -e clients/python[dev]
      - run: python -m pytest -q clients/python
  docker:
    # Fork code must be reviewed before it is copied to a trusted branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, arc-amd64]
    needs: [node]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: docker build -f apps/hub/Dockerfile -t atriarch/tracery-hub:ci .
