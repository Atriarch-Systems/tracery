name: release
on:
  push:
    tags: ['v*']
  # Manual runs validate only. A new stable version tag enables publication.
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: tracery-release
  cancel-in-progress: false
env:
  LOCAL_IMAGE: tracery-release:${{ github.run_id }}
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, arc-amd64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.2' }
      - name: Check release ref
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = JSON.parse(fs.readFileSync('package.json'));
          const hub = JSON.parse(fs.readFileSync('apps/hub/package.json'));
          if (!/^0\.[0-9]+\.[0-9]+$/.test(root.version) || hub.version !== root.version) throw Error('Invalid coordinated release version');
          if (process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF !== `refs/tags/v${root.version}`) throw Error('Tag must match package version');
          NODE
      - run: npm ci
      - run: npm run license:check
      - run: node --test scripts/release-license-gate.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm test && npm run test:plugin
      - name: Test and retain actual npm tarballs
        run: npm run publish:check
        env:
          TRACERY_RELEASE_DIR: artifacts/npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: python -m pip install -e 'clients/python[dev]' && python -m pytest -q clients/python
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with: { version: v0.74.0, cache: false }
      - name: Inspect packaged npm files and record source SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/reports artifacts/unpacked
          for file in artifacts/npm/*.tgz; do
            target="artifacts/unpacked/$(basename "$file" .tgz)"
            mkdir -p "$target"
            tar -xzf "$file" -C "$target"
          done
          trivy fs --scanners license,secret --license-full --skip-version-check --format json --output artifacts/reports/npm-scan.json artifacts/unpacked
          node scripts/release-license-gate.mjs artifacts/reports/npm-scan.json
          trivy fs --scanners license --include-dev-deps --offline-scan --skip-version-check --skip-dirs .git --skip-dirs artifacts --format cyclonedx --output artifacts/reports/source-sbom.cdx.json .
      - name: Build and test the image with matching sources
        run: |
          docker build --platform linux/amd64 --provenance=false -f apps/hub/Dockerfile -t "$LOCAL_IMAGE" .
          node scripts/release-image-check.mjs "$LOCAL_IMAGE" artifacts/container
      - name: Gate final image and record its SBOM
        run: |
          trivy image --image-src docker --scanners vuln,license,secret --license-full --list-all-pkgs --skip-version-check --format json --output artifacts/reports/image-scan.json "$LOCAL_IMAGE"
          node scripts/release-license-gate.mjs artifacts/reports/image-scan.json artifacts/container/alpine-packages.json artifacts/container/NODE-LICENSE
          trivy image --image-src docker --scanners license --skip-version-check --format cyclonedx --output artifacts/reports/image-sbom.cdx.json "$LOCAL_IMAGE"
      - name: Save tested image and checksums
        run: |
          docker save "$LOCAL_IMAGE" | gzip > artifacts/container/image.tar.gz
          docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}' > artifacts/container/image-id.txt
          git rev-parse HEAD > artifacts/reports/source-commit.txt
          cp apps/hub/web/dist/THIRD-PARTY-NOTICES.txt artifacts/reports/
          cd artifacts
          find npm container reports -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-candidate
          path: |
            artifacts/npm/
            artifacts/container/
            artifacts/reports/
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Remove local build tag
        if: always()
        run: docker image rm "$LOCAL_IMAGE" || true

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: [self-hosted, Linux, X64, arc-amd64]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Set this to the confirmed public Docker Hub repository, e.g. atriarch/tracery-hub.
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: artifacts
      - name: Verify artifacts and required publication settings
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo 'Missing NPM_TOKEN'; exit 1; }
          test -n "$DOCKER_USERNAME" || { echo 'Missing DOCKERHUB_USERNAME'; exit 1; }
          test -n "$DOCKER_TOKEN" || { echo 'Missing DOCKERHUB_TOKEN'; exit 1; }
          [[ "$DOCKERHUB_IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]] || { echo 'Set DOCKERHUB_IMAGE to namespace/repository'; exit 1; }
          (cd artifacts && sha256sum -c SHA256SUMS)
          test "$(cat artifacts/reports/source-commit.txt)" = "$GITHUB_SHA"
          npm whoami --registry https://registry.npmjs.org
          gzip -dc artifacts/container/image.tar.gz | docker load
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')" = "$(cat artifacts/container/image-id.txt)"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check public Docker repository and immutable version
        run: node scripts/release-docker-check.mjs
      - name: Publish tested npm tarballs in dependency order
        run: node scripts/release-npm.mjs artifacts/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish tested image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          docker tag "$LOCAL_IMAGE" "$DOCKERHUB_IMAGE:$version"
          docker push "$DOCKERHUB_IMAGE:$version"
          docker tag "$LOCAL_IMAGE" "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:latest"
      - name: Publish GitHub release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: node scripts/release-github.mjs
      - name: Remove local image tags
        if: always()
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker image rm "$LOCAL_IMAGE" || true
          if [ -n "$DOCKERHUB_IMAGE" ]; then docker image rm "$DOCKERHUB_IMAGE:${VERSION#v}" "$DOCKERHUB_IMAGE:latest" || true; fi
